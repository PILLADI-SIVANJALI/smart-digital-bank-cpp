<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw Money | Smart Digital Bank</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">

<i class="fa-solid fa-building-columns"></i>

<span>Smart Digital Bank</span>

</div>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="profile.html">Profile</a>

<a href="#" onclick="logout()">Logout</a>

</nav>

</header>

<section class="withdraw-page">

<div class="withdraw-box">

<i class="fa-solid fa-money-bill-transfer withdraw-icon"></i>

<h2>Withdraw Money</h2>

<p class="balance-text">

Current Balance

<strong id="currentBalance">₹0</strong>

</p>

<form id="withdrawForm" onsubmit="withdrawMoney(event)">

<div class="input-box">

<label>Enter Withdrawal Amount</label>

<input
type="number"
id="withdrawAmount"
placeholder="Enter Amount"
min="1"
required>

</div>

<button class="login-button" type="submit">

Withdraw Money

</button>

</form>

<br>

<a href="dashboard.html" class="back-btn">

← Back to Dashboard

</a>

</div>

</section>

<footer>

© 2026 Smart Digital Bank

</footer>

<script>

let balance = localStorage.getItem("balance");

if(balance == null)
{
    balance = 0;
}

document.getElementById("currentBalance").innerHTML = "₹" + balance;

</script>

<script src="script.js"></script>

</body>

</html>
