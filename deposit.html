<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit Money | Smart Digital Bank</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>
 
<body>

<header>

<div class="logo">
<i class="fa-solid fa-building-columns"></i>
<span>Smart Digital Bank</span>
</div>

<nav>
<a href="dashboard.html">Dashboard</a>
<a href="profile.html">Profile</a>
<a href="login.html">Logout</a>
</nav>

</header>

<section class="deposit-page">

<div class="deposit-box">

<i class="fa-solid fa-money-bill-wave deposit-icon"></i>

<h2>Deposit Money</h2>

<p class="balance-text">
Current Balance
<strong id="currentBalance">₹0</strong>
</p>

<form id="depositForm" onsubmit="depositMoney(event)">

<div class="input-box">

<label>Enter Deposit Amount</label>

<input
type="number"
id="depositAmount"
min="1"
placeholder="Enter Amount"
required>

</div>

<button type="submit" class="login-button">
Deposit Money
</button>

</form>

<br>

<a href="dashboard.html" class="back-btn">
← Back to Dashboard
</a>

</div>

</section>

<footer>

© 2026 Smart Digital Bank

</footer>

<script>

let balance = localStorage.getItem("balance");

if(balance==null)
{
    balance=0;
}

document.getElementById("currentBalance").innerHTML="₹"+balance;

</script>

<script src="script.js"></script>

</body>
</html>
