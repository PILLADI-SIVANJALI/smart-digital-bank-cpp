<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Digital Bank | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        <i class="fa-solid fa-building-columns"></i>
        <span>Smart Digital Bank</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Open Account</a>
    </nav>

</header>

<section class="login-page">

    <div class="login-box">

        <i class="fa-solid fa-user-lock login-icon"></i>

        <h2>Customer Login</h2>

        <form id="loginForm" onsubmit="login(event);" autocomplete="off">

            <div class="input-box">

                <label>Account Number</label>

                <input
                    type="text"
                    id="account"
                    placeholder="Enter Account Number"
                    maxlength="10"
                    required>

            </div>

            <div class="input-box">

                <label>4 Digit PIN</label>

                <div class="password-field">

                    <input
                        type="password"
                        id="pin"
                        maxlength="4"
                        placeholder="Enter PIN"
                        required>

                    <span id="togglePassword" style="cursor:pointer;">
                        <i class="fa-solid fa-eye"></i>
                    </span>

                </div>

            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot PIN?</a>

            </div>

            <button type="submit" class="login-button">
                Login
            </button>

            <br><br>

            <p>
                New Customer?
                <a href="register.html">Create Account</a>
            </p>

        </form>

    </div>

</section>

<footer>
    © 2026 Smart Digital Bank
</footer>

<script src="script.js"></script>

</body>
</html>
