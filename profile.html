<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Smart Digital Bank</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
<i class="fa-solid fa-building-columns"></i>
<span>Smart Digital Bank</span>
</div>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="statement.html">Statement</a>

<a href="#" onclick="logout()">Logout</a>

</nav>

</header>

<section class="profile-page">

<div class="profile-card">

<i class="fa-solid fa-circle-user profile-icon"></i>

<h2>Customer Profile</h2>

<table class="profile-table">

<tr>
<td><strong>Customer Name</strong></td>
<td id="profileName"></td>
</tr>

<tr>
<td><strong>Account Number</strong></td>
<td id="profileAccount"></td>
</tr>

<tr>
<td><strong>Available Balance</strong></td>
<td id="profileBalance" style="color:#00ff99;font-weight:bold;"></td>
</tr>

<tr>
<td><strong>Status</strong></td>
<td style="color:lime;">Active</td>
</tr>

</table>

<br>

<div class="profile-buttons">

<a href="dashboard.html" class="btn-primary">
Dashboard
</a>

<a href="#" onclick="logout()" class="btn-secondary">
Logout
</a>

</div>

</div>

</section>

<footer>

© 2026 Smart Digital Bank

</footer>

<script>

document.getElementById("profileName").innerHTML =
localStorage.getItem("name");

document.getElementById("profileAccount").innerHTML =
localStorage.getItem("account");

document.getElementById("profileBalance").innerHTML =
"₹" + localStorage.getItem("balance");

function logout()
{
    localStorage.clear();
    window.location.href="login.html";
}

</script>

<script src="script.js"></script>

</body>
</html>
