<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mini Statement | Smart Digital Bank</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="style.css">

<style>

.statement-container
{
    max-width:1100px;

    margin:50px auto;

    padding:35px;

    background:rgba(255,255,255,0.10);

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}


.statement-icon
{
    font-size:55px;

    text-align:center;

    margin-bottom:15px;
}


.statement-container h1
{
    text-align:center;

    margin-bottom:10px;
}


.subtitle
{
    text-align:center;

    margin-bottom:30px;
}


.balance
{
    text-align:center;

    font-size:25px;

    margin-bottom:30px;
}


.balance span
{
    font-weight:bold;

    color:#00d9ff;
}


table
{
    width:100%;

    border-collapse:collapse;

    overflow:hidden;

    border-radius:10px;
}


th
{
    background:#00cfee;

    color:#061b3a;

    padding:15px;

    text-align:center;
}


td
{
    padding:14px;

    text-align:center;

    border-bottom:1px solid rgba(255,255,255,0.15);
}


tr:hover
{
    background:rgba(255,255,255,0.08);
}


.credit
{
    color:#00ff55;

    font-weight:bold;
}


.debit
{
    color:#ff3b30;

    font-weight:bold;
}


.mode
{
    font-weight:bold;
}


.status
{
    color:#00ff55;

    font-weight:bold;
}


.no-transactions
{
    text-align:center;

    padding:30px;

    font-size:18px;
}


.back-button
{
    display:block;

    width:max-content;

    margin:30px auto 0;

    padding:12px 25px;

    background:#00cfee;

    color:#061b3a;

    text-decoration:none;

    border-radius:8px;

    font-weight:bold;
}


@media(max-width:800px)
{

    .statement-container
    {
        margin:20px;

        padding:15px;

        overflow-x:auto;
    }


    table
    {
        min-width:800px;
    }

}

</style>

</head>


<body>

<header>

<div class="logo">

<i class="fa-solid fa-building-columns"></i>

<span>Smart Digital Bank</span>

</div>


<nav>

<a href="dashboard.html">Dashboard</a>

<a href="profile.html">Profile</a>

<a href="#" onclick="logout()">Logout</a>

</nav>

</header>


<section class="statement-container">

<div class="statement-icon">

<i class="fa-solid fa-file-lines"></i>

</div>


<h1>Mini Statement</h1>

<p class="subtitle">
Recent account transactions
</p>


<div class="balance">

Available Balance:

<span id="currentBalance">
₹0
</span>

</div>


<table>

<thead>

<tr>

<th>Date</th>

<th>Transaction</th>

<th>Amount</th>

<th>Mode</th>

<th>Status</th>

</tr>

</thead>


<tbody id="transactionTable">

<tr>

<td colspan="5">

Loading transactions...

</td>

</tr>

</tbody>

</table>


<a href="dashboard.html"
class="back-button">

← Back to Dashboard

</a>

</section>


<footer>

© 2026 Smart Digital Bank

</footer>


<script src="script.js"></script>


<script>


// ==========================================
// LOAD MINI STATEMENT
// ==========================================

function loadStatement()
{

    let account =
    localStorage.getItem("account");


    let balance =
    localStorage.getItem("balance");


    if(!account)
    {

        window.location.href="login.html";

        return;

    }


    // Show current balance

    document.getElementById("currentBalance").innerHTML =
    "₹" + (balance || "0");


    fetch(
        "http://localhost:5000/statement?account="
        + encodeURIComponent(account)
    )


    .then(response => response.json())


    .then(data =>
    {

        let table =
        document.getElementById("transactionTable");


        if(!data.success)
        {

            table.innerHTML =

            `<tr>
                <td colspan="5">
                    ${data.message}
                </td>
            </tr>`;

            return;

        }


        if(!data.transactions ||
           data.transactions.length === 0)
        {

            table.innerHTML =

            `<tr>
                <td colspan="5" class="no-transactions">
                    No transactions found.
                </td>
            </tr>`;

            return;

        }


        table.innerHTML = "";


        data.transactions.forEach(transaction =>
        {

            let amount =
            parseFloat(transaction.amount);


            let amountClass =
            transaction.mode === "Credited"
            ? "credit"
            : "debit";


            let sign =
            transaction.mode === "Credited"
            ? "+"
            : "-";


            let row = document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${transaction.date}
                </td>

                <td>
                    ${transaction.transaction}
                </td>

                <td class="${amountClass}">
                    ${sign} ₹${amount}
                </td>

                <td class="mode">
                    ${transaction.mode}
                </td>

                <td class="status">
                    ${transaction.status}
                </td>

            `;


            table.appendChild(row);

        });

    })


    .catch(error =>
    {

        console.log(error);


        document.getElementById("transactionTable").innerHTML =

        `<tr>
            <td colspan="5" class="no-transactions">
                Cannot connect to server.
                <br>
                Make sure Flask is running on port 5000.
            </td>
        </tr>`;

    });

}


// Load statement when page opens

loadStatement();

</script>


</body>

</html>
